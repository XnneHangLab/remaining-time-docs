task:
  id: relic-s01-erased-door-tag
  title: S01 · 消磁门牌
  status: proposal
  package: remaining-time / mainline
  trigger:
    time: 序章结束后
    place: 404号舱门外
    requires:
    - 玩家已获404遗留物临时联系人资格
  objects:
  - id: door-tag-317
    result: 扫描留存痕迹但不转移原件；暂借与最终交付必须记录保管人
    initial_state: 先在317门框旁出现；玩家可现场扫描或按权限暂借原件
    possible_actions:
    - 观察
    - 扫描
    - 暂借
    - 交付
  - id: registry-317
    result: 提供覆写记录和签名校准材料，不直接公开私人正文
    initial_state: 计时所公开索引；姓名栏为空，旧版签名仅在合适权限下可比对
    possible_actions:
    - 查询
    - 比对
  - id: cabinet-404
    result: 只有实际收到原件才能确认暂存
    initial_state: 可选的门牌实物暂存地点
    possible_actions:
    - 核对
    - 收存
  stages:
  - id: hear-metal
    place: 404号舱门口
    background: 玩家刚完成入住确认，听见门外短促的金属碰撞声。门外出现不在404清单内的物件。
    reveal: 玩家只知道门外有异常物件，还不知道它是什么或属于谁。
    goal: 出门查看响声来源。
    title: 听见金属声
    script:
    - type: narration
      text: 404号舱外传来一声短促的金属碰撞，像薄金属撞上墙面后滑落。
    - type: npc
      speaker: N-07
      text: 检测到门外有未登记物件。它不在404的清单里。
    - type: player
      text: 打开门，去看看是什么掉在了外面。
    event:
      intent: 用局部异常引出调查，不替玩家预先判断物件身份。
      must_establish:
      - 门外有未登记物件
      must_not_establish:
      - 提前透露317门牌或Eden身份
      - 声称物件属于玩家
      acceptable_actions:
      - 玩家走出404并查看门外
    outcome:
      success: 玩家到达门外并发现异常来源。
      next_stage: meet-resident
      retained: []
    interruptions:
      leave: 已完成的观察、记录和来源保留；玩家回来后从当前阶段继续。
      repeat: 可以再次查看或询问，但不重复生成同一事实或材料。
  - id: meet-resident
    place: 下层回廊，317空门框旁
    background: 一位陌生住户正在尝试把旧金属牌装回门框；卡扣松动，门牌随后掉落。
    reveal: 玩家看见试装经过，但不知道门牌原主和完整流转过程。
    goal: 选择接触或绕开陌生住户，观察门牌落地。
    title: 遇见陌生住户
    script:
    - type: narration
      text: 一个陌生住户正在把旧金属牌往空门框上按，卡扣却始终没有咬住。
    - type: player
      text: 主动询问、等对方先说明，或从门框另一侧绕过去。
    - type: narration
      text: 金属牌从他手边滑落，翻过一面，停在空门框下。
    event:
      intent: 让玩家的接触方式可被记录，但不因回避而失去调查入口。
      must_establish:
      - 住户在试装旧门牌
      - 门牌掉到门框下
      must_not_establish:
      - 让住户说出原住户姓名
      - 把回避视为任务失败
      acceptable_actions:
      - 玩家主动询问、等待对方开口，或绕过对方
    outcome:
      success: 门牌落地且玩家能继续调查。
      next_stage: inspect-tag
      retained: []
    interruptions:
      leave: 已完成的观察、记录和来源保留；玩家回来后从当前阶段继续。
      repeat: 可以再次查看或询问，但不重复生成同一事实或材料。
  - id: inspect-tag
    place: 下层回廊，317门牌旁
    background: 门牌正面的317仍可辨认，姓名区域被擦白，下沿底码和侧边缺口留有痕迹。
    reveal: 这些痕迹证明门牌受过处理，不能单独证明谁动了手。
    goal: 扫描痕迹，决定是否按权限暂借原件。
    title: 查看门牌
    script:
    - type: narration
      text: 门牌上的317仍然清楚，姓名区域被擦成发白的一片；底码、缺口和工具痕迹留在边缘。
    - type: npc
      speaker: N-07
      text: 我可以保存物理痕迹。你可以只在现场扫描，也可以按权限暂借原件。
    - type: player
      text: 记录门牌痕迹，并决定现场保留还是暂借原件。
    event:
      intent: 区分记录物理证据和取得实物保管权。
      must_establish:
      - 房号317
      - 姓名被擦白
      - 门牌留有底码与工具痕迹
      must_not_establish:
      - 用划痕直接指认Ash
      - 把现场扫描当成取得原件
      - 提前说出Eden
      acceptable_actions:
      - 玩家扫描门牌，可选择现场保留或暂借原件
    outcome:
      success: 痕迹已记录，原件位置明确。
      next_stage: find-source
      retained: []
    interruptions:
      leave: 已完成的观察、记录和来源保留；玩家回来后从当前阶段继续。
      repeat: 可以再次查看或询问，但不重复生成同一事实或材料。
  - id: find-source
    place: 下层回廊，Ash的维修台或Mara的旧物摊
    background: 门牌有拆取痕迹，但来源和后续流转仍不完整。Ash与Mara分别可能提供不同片段。
    reveal: 任一来源只能证明自己知道的经手环节。
    goal: 取得一份有明确来源的经手记录。
    title: 核对门牌来源
    script:
    - type: player
      text: 向Ash或Mara询问：你见过这块317门牌吗？
    - type: npc
      speaker: Ash
      text: 我从317的门框上拆过它。之后它怎么转手，我不能替别人作证。
    - type: npc
      speaker: Mara
      text: 我这里留着一次转售签。它能证明我经手过一回，不能替前后的人补上故事。
    event:
      intent: 区分当前证词、摊位文书和未经证实的推测。
      must_establish:
      - Ash可说明拆取经过
      - Mara或摊位签可说明一次交易
      must_not_establish:
      - 补全未经取证的完整流转链
      - 将交易记录当成所有权证明
      acceptable_actions:
      - 询问Ash或Mara；当事人不可用时核对留存交易签
    outcome:
      success: 至少一份可核对的经手来源已保存。
      next_stage: get-lookup
      retained: []
    interruptions:
      leave: 已完成的观察、记录和来源保留；玩家回来后从当前阶段继续。
      repeat: 可以再次查看或询问，但不重复生成同一事实或材料。
  - id: get-lookup
    place: 计时所公开队列
    background: 物理痕迹和经手来源都不能单独确认原住户；计时所提供房号查询入口。
    reveal: 玩家需要公开查询号才能进一步核对。
    goal: 取得317公开查询入口。
    title: 取得查询入口
    script:
    - type: narration
      text: 计时所的公开队列里有人认出404的执行人身份，但正式记录仍要从公开查询入口开始。
    - type: player
      text: 询问317的公开查询入口，或离开队列后向Adrian核对。
    - type: npc
      speaker: Adrian
      text: 317使用同一个公开查询号。这里是入口，正式记录仍要由终端核验。
    event:
      intent: 允许玩家回应、主动询问或避开陌生居民，三种路线都不阻断查询。
      must_establish:
      - 317有公开查询入口
      must_not_establish:
      - 因玩家回避交谈而提高查询代价
      - 提前打开封存档
      acceptable_actions:
      - 玩家选择如何与队列中的人接触，必要时向Adrian询问
    outcome:
      success: 玩家获得可使用的317查询入口。
      next_stage: compare-record
      retained: []
    interruptions:
      leave: 已完成的观察、记录和来源保留；玩家回来后从当前阶段继续。
      repeat: 可以再次查看或询问，但不重复生成同一事实或材料。
  - id: compare-record
    place: 计时所登记终端
    background: 317公开索引仍在，但姓名栏为空；404临时联系人资格允许比对覆写前后的签名。
    reveal: 比对不会直接解封私人正文。
    goal: 核对房号记录的覆写痕迹。
    title: 比对房号记录
    script:
    - type: npc
      speaker: Meridian
      text: 当前记录中的姓名栏为空。可以按404临时联系人权限比较覆写前后的签名。
    - type: player
      text: 比较当前记录与覆写前版本，只提取校准所需的信息。
    - type: npc
      speaker: Meridian
      text: 系统返回签名哈希和覆写信息，但不会打开未发送的私人记录。
    event:
      intent: 提供最小的来源校准材料，不代替身份结论。
      must_establish:
      - 317索引仍在
      - 姓名字段曾被覆写
      - 可以获得签名比对材料
      must_not_establish:
      - 终端直接说出Eden
      - 打开未发送私人日志
      - 将封套视为全面授权
      acceptable_actions:
      - 玩家按权限请求签名比对，终端故障时申请等价人工记录
    outcome:
      success: 有效的覆写比对材料已取得。
      next_stage: calibrate
      retained: []
    interruptions:
      leave: 已完成的观察、记录和来源保留；玩家回来后从当前阶段继续。
      repeat: 可以再次查看或询问，但不重复生成同一事实或材料。
  - id: calibrate
    place: 404号舱，N-07附近
    background: 门牌痕迹、经手来源与登记签名齐备；各来源只证明各自范围，须核对签名是否一致。
    reveal: 身份结论尚未在校准前对玩家公开。
    goal: 请N-07核对三类材料。
    title: 校准身份
    script:
    - type: npc
      speaker: N-07
      text: 三类来源已经齐备。我们可以核对签名是否一致，但校准本身不代表原物所有权。
    - type: player
      text: 提交来源并确认校准。
    - type: npc
      speaker: N-07
      text: 校准结果显示，门牌最早关联的住户是清洁工Eden。姓名曾从317索引中被覆写。
    event:
      intent: 在材料齐备且签名吻合时确认原住户与展示边界，不把校准当成产权证明。
      must_establish:
      - 校准成功后可确认原住户为清洁工Eden
      - 她的姓名曾被覆写
      - 她不愿以姓名或形象做公共纪念
      must_not_establish:
      - 补齐未经证明的流转链
      - 公开未发送日志
      - 自动移动门牌原件
      acceptable_actions:
      - 玩家提交三类来源并确认校准
    outcome:
      success: 来源已校准且身份结论已确认。
      next_stage: review-claim
      retained: []
    interruptions:
      leave: 已完成的观察、记录和来源保留；玩家回来后从当前阶段继续。
      repeat: 可以再次查看或询问，但不重复生成同一事实或材料。
  - id: review-claim
    place: 接待会前厅与公开目录
    background: 玩家已确认门牌与Eden的关联；接待会有人主张使用覆写前后的身份数据。
    reveal: 商业使用主张不是既得授权，门牌实物与身份数据不是同一项权利。
    goal: 查清接待会提出了什么用途主张。
    title: 查看使用主张
    script:
    - type: npc
      speaker: Noel
      text: 第一次来这种接待会，很容易把推销词听成权利证明。你想问什么，可以先找我。
    - type: player
      text: 询问展览和训练用途具体想取得什么。
    - type: npc
      speaker: Celeste
      text: 我的条件涉及可被授权的展览和训练用途，不等于我已经拥有Eden，也不等于门牌自动附带她的同意。
    event:
      intent: 让玩家区分提出主张和真正获得授权；接触陌生宾客不是必经路径。
      must_establish:
      - 展览与训练用途被提出
      - Celeste尚未取得Eden授权
      must_not_establish:
      - 把Celeste当作现有所有人
      - 把玩家接触方式当成访问目录的资格
      acceptable_actions:
      - 经Noel引见、与宾客交谈，或独自阅读公开目录
    outcome:
      success: 玩家已获知可供比较的商业使用主张。
      next_stage: draft-rights
      retained: []
    interruptions:
      leave: 已完成的观察、记录和来源保留；玩家回来后从当前阶段继续。
      repeat: 可以再次查看或询问，但不重复生成同一事实或材料。
  - id: draft-rights
    place: 404号舱，N-07附近
    background: 玩家已了解Eden身份、她的展示边界及外部使用主张，须分别考虑实物、缓存与故事公开范围。
    reveal: 保存草稿不会移动原件，也不会直接完成任务。
    goal: 分别拟定三项权利安排。
    title: 拟定权利安排
    script:
    - type: npc
      speaker: N-07
      text: 请分别决定三件事：谁保管门牌实物，谁能访问覆写缓存，以及外界可以如何讲述317住过的人。
    - type: player
      text: 分别拟定实物保管、缓存访问和故事公开范围。
    - type: npc
      speaker: N-07
      text: 草稿保存后，原件仍在当前位置；三项选择不会互相替代。
    event:
      intent: 分开确认实物保管、缓存访问和故事公开；冲突选项可以被讨论，但不能伪装成已有授权。
      must_establish:
      - 实物保管不授予数据访问
      - 数据访问不授予公开讲述
      - 实名纪念与Eden留下的边界冲突
      must_not_establish:
      - 用单一决定覆盖三项权利
      - 保存草稿时移动原件
      - 将有争议选项隐藏或自动认可
      acceptable_actions:
      - 玩家分别选择实物保管地、缓存访问范围及故事公开范围
    outcome:
      success: 三项权利均已有明确草稿，不代表已交付实物。
      next_stage: handover
      retained: []
    interruptions:
      leave: 已完成的观察、记录和来源保留；玩家回来后从当前阶段继续。
      repeat: 可以再次查看或询问，但不重复生成同一事实或材料。
  - id: handover
    place: 当前门牌位置及选定保管地点
    background: 三权草稿已保存，但实物可能还留在317门框；只有原件实际交付并得到回执才算完成。
    reveal: 回执证明保管交付，不证明原物所有权或完整流转链。
    goal: 取得原件并交付给选定保管人。
    title: 交付门牌原件
    script:
    - type: npc
      speaker: N-07
      text: 权利草稿已经保存。现在请核对原件位置，并把它交给选定的实际保管人。
    - type: player
      text: 取得原件，交给选定保管人，并确认对方签收。
    - type: npc
      speaker: N-07
      text: 实物交付与草稿一致。登记完成，回执只证明保管交付。
    event:
      intent: 核对原件位置与目标保管人，完成实物交接后再确认任务结果。
      must_establish:
      - 原件不会因草稿自动移动
      - 交付必须由目标保管人实际接收
      must_not_establish:
      - 无原件时生成回执
      - 门牌仍在走廊时宣称任务完成
      - 将回执当成产权证明
      acceptable_actions:
      - 若原件仍在门框旁，玩家先按权限暂借
      - 玩家将原件交给草稿指定的保管人并取得回执
    outcome:
      success: 原件已交付并取得相符回执。
      next_stage: done
      retained: []
    interruptions:
      leave: 已完成的观察、记录和来源保留；玩家回来后从当前阶段继续。
      repeat: 可以再次查看或询问，但不重复生成同一事实或材料。
  summary:
    background: 玩家入住404后，门外一块姓名被擦除的317旧门牌引出调查。玩家需要核对门牌痕迹、经手来源与房号记录，才能确认原住户，并决定物件与相关信息如何保存和使用。
    goal: 确认317门牌与原住户的关联，分别处理实物、相关记录和公开讲述边界。
    boundary: 本任务不证明完整流转链、原物所有权，也不自动授予私人记录或训练使用许可。
    scale: 10个事件阶段；三次人物接触、三类取证、一次校准和一次实物交付。
  participants:
  - id: n07
    name: N-07
    facts:
    - 门牌需要来源校准，私人记录不能直接公开
    context: 提示遗留物处理边界、核对材料、协助登记
  - id: resident-317
    name: 陌生住户
    context: 在门框旁试装旧门牌；其接触方式由玩家选择
  - id: ash
    name: Ash
    context: 可说明自己拆取门牌的经过；不能证明后续全部流转
  - id: mara
    name: Mara
    context: 可提供摊位经手记录；记录只证明其中一次交易
  - id: adrian
    name: Adrian
    context: 在计时所提供公开查询入口或人工记录
  - id: meridian
    name: Meridian
    context: 提供317公开索引及权限范围内的版本比对
  - id: noel
    name: Noel
    context: 在接待会为玩家提供中性引见
  - id: celeste
    name: Celeste
    context: 提出展览与训练用途主张；并未自动取得授权
  result:
    success: 玩家确认门牌与Eden的关联，分别登记实物保管、缓存访问与故事公开范围，实际交付原件并取得回执。
    boundary: 本任务不证明完整流转链、原物所有权，也不自动授予私人记录或训练使用许可。
    reward: 无额外物品奖励；保留调查结论与交接回执。
    cancel: 保留已取得的来源、草稿和原件当前位置，返回后继续。
    repeat: 不重复授予材料或生成回执；完成后可回顾来源。

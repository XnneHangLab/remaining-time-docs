task:
  id: relic-s01-erased-door-tag
  title: S01 · 消磁门牌
  status: ready
  package: remaining-time / mainline
  flow: linear
  branch_policy: 每个阶段只有一个推进动作；旁观、离开和返回不改变任务状态；本卡不包含替代来源、替代交付或性格分支。
  tier: standard
  case_cluster: A / 不存在的317号舱
  chapter_window: Ch1→Ch3
  background: 玩家在404门外发现一块姓名被消磁的317旧门牌，按固定顺序保存痕迹、核对交易签和制度记录、完成签名校准，并把门牌交回404暂存柜。
  trigger:
    time: PROLOGUE_END / 18:00 后
    place: low-deck / low-deck.door-tag-317
    requires: [prologue_privacy_notice_done=true, executor_credential_404=true, recovery_notice_played=true]
  actors:
    - id: player
      name: 玩家
      role: 404遗留物临时联系人；执行调查和交接
    - id: n07
      name: N-07
      role: 保存校准材料、揭示身份边界和确认交付
    - id: resident-door
      name: 陌生住户
      role: 门牌出现时的现场接触对象
    - id: mara.sale-receipt-317
      name: 交易签
      role: 本线唯一经手来源
    - id: resident-queue
      name: 排队居民
      role: 提供查询入口
    - id: adrian
      name: Adrian
      role: 提供固定的最小化查询记录
    - id: noel
      name: Noel
      role: 接待会前厅的固定引见对象
    - id: collector
      name: 陌生宾客
      role: 说明公开目录中的使用主张
  objects:
    - id: low-deck.door-tag-317
      state: 落在317空门框下；本线只原地扫描，不移动原件
    - id: mara.sale-receipt-317
      state: 带时间戳的固定交易签；只证明一次经手
    - id: office.registry-terminal
      state: 317公开索引；姓名栏为空，可用404凭证读取最小比较记录
    - id: reception.door-tag-claim
      state: 接待会公开目录中的使用主张
    - id: unit-404.cabinet
      state: 404遗留物暂存柜；本线唯一交付地点
  evidence:
    physical_trace: door_tag_trace
    data_cache: registry_317_cache
    testimony: handoff_testimony
    identity_gate: executor_credential_404 && tag_resident_sig_hash=registry_resident_sig_hash
    fallback: none；材料缺失时停留当前阶段
    shared_evidence: TODO；稳定evidence_id和跨任务只读引用待工程评审
  synthesis:
    site: unit-404 / unit-404.cabinet
    claim: 确认门牌与原住户Eden的签名关联，以及不以姓名或形象制作公共纪念的边界
    does_not_prove: 完整流转链、原物所有权、训练授权或私人日志内容
  rights_claimants: 实物放入404暂存柜；缓存仅用于权利核验；故事不对外公开
  shared_scene_ids: [low-deck, civic-office, celeste-reception]
  task_state: UNDISCOVERED → ACTIVE → MATERIALS_PARTIAL → READY_TO_SYNTHESIZE → RECONSTRUCTED → RIGHTS_REGISTERED
  stages:
    - id: s01-00-hear-metal
      place: low-deck / 404出口
      reveal: 玩家出门后只知道门外有未登记物件和金属落地声。
      writer:
        background: 序章已经完成基础规则教学，S01从门外的局部异常开始。
        script:
          - speaker: narrator
            text: 门外传来一声金属落地声。下层回廊出现一件不在404清单里的物件。
      coder:
        dialogue:
          purpose: 将玩家从序章交给门牌调查
          facts: [玩家已离开404, 门外出现未登记物件]
          forbid: [提前出现Eden, 提前解释门牌来源]
          tone: restrained
        action: enter low-deck after prologue completion
        success: s01-00-hear-metal completed
        effects: [door_tag_spawned=true]
        next: s01-01-meet-resident
    - id: s01-01-meet-resident
      place: low-deck / resident-door
      reveal: 陌生住户正在把旧金属牌试装回空门框，卡扣没有咬住。
      writer:
        background: 玩家主动询问住户，住户说明自己只是试装门牌；门牌随即落到空门框下。
        script:
          - speaker: player
            choice: approach_and_ask
            text: 需要帮忙吗？这块牌原来挂在这里？
          - speaker: resident-door
            text: 卡扣早坏了。我只是想看看它还能不能装回去。
      coder:
        dialogue:
          purpose: 让门牌以可观察的现场事实出现
          facts: [住户正在试装门牌, 卡扣失效, 门牌落在空门框下]
          forbid: [透露原住户姓名, 写入性格分支, 让本阶段出现其他推进回应]
          tone: neutral
        action: choice.approach_and_ask
        success: door_tag_spawned=true
        effects: [door_tag_spawned=true]
        next: s01-02-inspect-tag
    - id: s01-02-inspect-tag
      place: low-deck / low-deck.door-tag-317
      reveal: 门牌写着317，姓名区域被擦白，边缘有工具划痕。
      writer:
        background: N-07提示先保存物理痕迹，不移动原件。
        script:
          - speaker: n07
            text: 先登记位置和状态。原件留在这里，完成一次校准扫描。
          - speaker: player
            choice: scan_in_situ
            text: 不移动门牌，只在原地留下扫描记录。
      coder:
        dialogue:
          purpose: 取得物理证据
          facts: [房号317, 姓名区域被消磁, 右侧有工具划痕]
          forbid: [把工具痕迹写成确定来源, 把扫描件写成玩家持有原件]
          tone: forensic
        action: choice.scan_in_situ
        success: door_tag_trace=true and tag_resident_sig_hash stored
        effects: [door_tag_trace=true, tag_resident_sig_hash=stored, door_tag_custody=317门框下]
        next: s01-03-find-source
    - id: s01-03-find-source
      place: low-deck / mara.sale-receipt-317
      reveal: 物理痕迹仍不能说明门牌完整流转，但固定交易签可以证明一次经手。
      writer:
        background: 玩家按提示前往Mara的旧物摊，读取带时间戳的交易签。
        script:
          - speaker: player
            choice: open_s01_source
            text: 核对317门牌的固定交易来源。
          - speaker: player
            choice: receipt_statement
            text: 记录交易签及其证明范围。
      coder:
        dialogue:
          purpose: 保存唯一经手来源
          facts: [交易签底码与门牌缺口对应, 交易签只证明一次交易]
          forbid: [补全完整转手链, 把交易签写成所有权证明]
          tone: source-conscious
        action: record mara.sale-receipt-317
        success: handoff_testimony=true
        effects: [handoff_testimony=true, testimony_source=交易签固定记录]
        next: s01-04-get-lookup-id
    - id: s01-04-get-lookup-id
      place: civic-office / public queue
      reveal: 玩家需要取得317公开查询号。
      writer:
        background: 玩家主动向排队居民询问查询入口，再到Adrian处取得最小化记录。
        script:
          - speaker: player
            choice: leave_queue_and_ask
            text: 你知道317的房号记录要从哪里查吗？
      coder:
        dialogue:
          purpose: 固定查询入口和最小记录来源
          facts: [317有公开查询号, 404凭证允许取得最小化记录]
          forbid: [打开私人日志, 把空白姓名写成不存在住户]
          tone: procedural
        action: choice.leave_queue_and_ask
        success: registry_lookup_id_317=true
        effects: [registry_lookup_id_317=true, lookup_source=排队居民]
        next: s01-05-compare-record
    - id: s01-05-compare-record
      place: civic-office / adrian
      reveal: Adrian按404凭证提供317最小化签名记录，姓名栏仍保持封存。
      writer:
        background: 玩家凭查询号和404执行人凭证取得最小记录，不打开私人日志。
        script:
          - speaker: adrian
            text: 317使用固定的公开查询号。这里是按404权限打印的最小记录。
          - speaker: player
            choice: print_registry
            text: 获取317最小化签名记录。
      coder:
        dialogue:
          purpose: 固定制度记录来源
          facts: [317有公开查询号, 404凭证允许取得最小化记录, 姓名字段曾被覆写]
          forbid: [打开私人日志, 把空白姓名写成不存在住户]
          tone: procedural
        action: choice.print_registry
        success: registry_317_cache=true
        effects: [registry_317_cache=true, registry_source=Adrian人工签名打印件]
        next: s01-06-calibrate
    - id: s01-06-calibrate
      place: unit-404 / n07
      reveal: 物理痕迹、交易签和最小化签名记录已经齐备，可以校准。
      writer:
        background: N-07核对三个来源和两个签名哈希。
        script:
          - speaker: n07
            text: 三项材料齐备，签名一致。现在执行校准。
          - speaker: player
            choice: calibrate_s01_evidence
            text: 核对来源并执行校准。
      coder:
        dialogue:
          purpose: 解锁Eden身份和展示边界
          facts: [门牌签名与官方签名一致, 姓名字段曾被覆写]
          forbid: [打开私人日志, 推断完整所有权或训练授权]
          tone: careful
        action: choice.calibrate_s01_evidence
        success: reconstructed_s01=true
        effects: [reconstructed_s01=true, former_resident_name=Eden, former_resident_role=cleaner, public_memorial_display=false]
        next: s01-07-review-claim
    - id: s01-07-review-claim
      place: celeste-reception / foyer and public catalog
      reveal: 玩家认识Noel后读取公开目录中的门牌身份数据使用主张。
      writer:
        background: Noel完成前厅引见，随后玩家向陌生宾客询问公开目录主张。
        script:
          - speaker: player
            choice: meet_noel
            text: 先认识前厅的Noel，再查看公开目录。
          - speaker: noel
            text: 我是Noel。推销词不等于权利证明，你可以先看公开目录。
          - speaker: collector
            text: 展厅关注的是覆写前后的身份差异，以及它能否用于展示和训练。
          - speaker: player
            choice: speak_to_new_guest
            text: 询问公开目录具体主张。
      coder:
        dialogue:
          purpose: 读取公开使用主张
          facts: [Noel已被认识, 目录包含展览和训练主张, 目录不构成授权]
          forbid: [把目录主张写成所有权, 用性格信号决定是否可读取]
          tone: commercial and restrained
        action: choice.meet_noel then choice.speak_to_new_guest
        success: s01_competing_claim_seen=true
        effects: [noel_met=true, s01_competing_claim_seen=true]
        next: s01-08-draft-rights
    - id: s01-08-draft-rights
      place: unit-404 / unit-404.cabinet
      reveal: 三项权利按固定默认值登记：404保管、仅核验缓存、不公开故事。
      writer:
        background: N-07逐项显示登记值，玩家按顺序确认，不在本卡选择其他组合。
        script:
          - speaker: n07
            text: 实物放入404暂存柜，缓存仅用于权利核验，故事不对外公开。
          - speaker: player
            choice: confirm_s01_rights_draft
            text: 确认三项登记草稿。
      coder:
        dialogue:
          purpose: 保存固定的三项权利登记
          facts: [实物保管为404暂存柜, 缓存仅用于权利核验, 故事不公开]
          forbid: [添加其他保管地点, 添加其他公开范围, 用一个按钮覆盖三项状态]
          tone: explicit
        action: set fixed rights and choice.confirm_s01_rights_draft
        success: s01_rights_draft_confirmed=true
        effects: [s01_physical=404暂存柜, s01_cache=仅权利核验, s01_story=不公开, s01_rights_draft_confirmed=true]
        next: s01-09-handover
    - id: s01-09-handover
      place: unit-404 / unit-404.cabinet
      reveal: 门牌原件仍在317门框下，需要按已确认规则交回404暂存柜。
      writer:
        background: 玩家返回门框取回原件，再将它交给404暂存柜。
        script:
          - speaker: player
            choice: retrieve_tag_for_handover
            text: 按提示暂借门牌原件。
          - speaker: player
            choice: handover_to_404
            text: 将门牌原件放入404暂存柜，确认回执。
      coder:
        dialogue:
          purpose: 让实际交付成为任务完成门槛
          facts: [原件仍在门框下, 404暂存柜是唯一交付地点]
          forbid: [没有原件时生成回执, 把回执写成所有权证明]
          tone: practical
        action: retrieve original then handover_to_404
        success: physical_handover_ack=true and s01_task_complete=true
        effects: [door_tag_custody=404暂存柜, physical_handover_ack=true, s01_task_complete=true]
        next: done
  result:
    success: S01完成；门牌物理痕迹、固定交易签和制度记录完成校准，Eden身份边界已记录，原件已交回404暂存柜。
    cancel: 保留已完成阶段和原件位置；返回当前目标继续。
    reject: 不推进当前阶段；返回当前目标重新执行。
    repeat: 已完成状态和回执不重复写入。
    unresolved: [运行时变量和效果语法仍由工程实现确认]

task:
  id: remaining-time-prologue
  title: 序章 · 404号舱
  status: proposal
  package: remaining-time / mainline
  tier: standard
  chapter_window: Prologue → Ch1
  background: 玩家入住404号舱。序章只完成入住确认、基础操作和遗留物处理规则；门外出现异常后进入S01。
  trigger:
    time: game start
    place: P_404 / unit-404.start
    requires: none
  actors:
    - id: player
      name: 玩家
      role: 404遗留物临时联系人；负责发现、登记和交接物件
    - id: n07
      name: N-07
      role: 404内置校准单元；说明入住和遗留物规则
    - id: recovery-system
      name: 回收系统
      role: 播放入住与遗留物通知
  objects:
    - id: unit-404.bed
      state: 玩家出生点；用于开始移动教学
    - id: unit-404.old-record
      state: 404内的旧记录；序章只提示存在，不读取正文
    - id: unit-404.cabinet
      state: 遗留物暂存柜；序章只提示用途
    - id: unit-404.return
      state: 通往下层回廊的出口；完成序章后进入S01
  handoff:
    writes: [prologue_privacy_notice_done=true, executor_credential_404=true, recovery_notice_played=true]
    opens: relic-s01-erased-door-tag
    clock: PROLOGUE_END=18:00
  stages:
    - id: wake-and-move
      place: P_404 / unit-404.bed
      reveal: 玩家已被分配到404号舱，需要先确认可以自行行动。
      writer:
        background: 玩家在404号舱醒来。N-07提示完成一次移动确认。
        script:
          - speaker: n07
            text: 404号舱已分配。请离开床边，确认移动正常。
          - speaker: player
            choice: stand_and_move
            text: 起身，在404号舱内走到床边以外的位置。
      coder:
        dialogue:
          purpose: 完成第一次移动教学
          facts: [玩家在404号舱醒来, 玩家需要自行移动]
          forbid: [提前说明前住户, 提前说明317或Eden, 讲解完整世界背景]
          tone: direct
        action: leave unit-404.bed and walk to a reachable room position
        success: player movement confirmed in unit-404
        effects: [prologue_woke=true]
        next: inspect-and-contact
    - id: inspect-and-contact
      place: P_404 / unit-404.old-record OR unit-404.cabinet OR n07
      reveal: 404内有旧记录和遗留物暂存柜；玩家可以查看公共物件并向N-07询问房间状态。
      writer:
        background: 玩家经过房间里的旧记录和暂存柜，随后与N-07交谈。
        script:
          - speaker: n07
            text: 404仍有未完成的遗留物登记。你可以查看公共物件，但私人记录不会自动开放。
          - speaker: player
            choice: inspect_404
            text: 查看旧记录或暂存柜，再询问N-07。
      coder:
        dialogue:
          purpose: 教授靠近、交互和开始NPC对话
          facts: [404有前住户留下的公共痕迹, 私人记录不会自动开放, 暂存柜用于遗留物登记]
          forbid: [读取旧记录正文, 暗示前住户姓名, 自动获得遗物]
          tone: practical
        action: interact with unit-404.old-record or unit-404.cabinet, then start dialogue with n07
        success: player has inspected a 404 object and opened n07 interaction
        effects: [room_familiarity=true]
        next: confirm-rules
    - id: confirm-rules
      place: P_404 / n07
      reveal: 玩家可以成为404遗留物临时联系人；这项职责用于发现、登记和交接，不要求玩家现在判断物件归属。
      writer:
        background: N-07说明404遗留物联系人的工作范围，玩家确认后继续。
        script:
          - speaker: n07
            text: 你的入住记录附带404遗留物临时联系职责。发现相关物件时，先登记位置和状态；需要移动时按提示暂借。
          - speaker: player
            choice: accept_executor_and_rules
            text: 明白。我先记录，再按提示处理。
      coder:
        dialogue:
          purpose: 说明遗留物联系人的工作范围
          facts: [玩家负责发现登记和交接404遗留物, 发现物件先登记位置和状态, 移动物件按提示暂借]
          forbid: [要求玩家现在判断物件归属, 提前讲解所有权或公开许可, 承诺所有记录解封, 提前透露具体前住户]
          tone: procedural
        action: choice.accept_executor_and_rules
        success: recovery contact role acknowledged
        effects: [executor_credential_404=true, prologue_privacy_notice_done=true]
        next: recovery-and-threshold
    - id: recovery-and-threshold
      place: P_404 / unit-404.return
      reveal: 404仍在遗留物回收流程中；发现相关物件时先登记位置和状态，需要移动时按提示暂借。
      writer:
        background: 回收系统播放通知。玩家走到出口时，门外传来金属落地声。
        script:
          - speaker: recovery-system
            text: 404入住恢复通知：本单元仍有未完成的遗留物登记。
          - speaker: recovery-system
            text: 发现相关物件时，请先登记位置和状态；需要移动、扫描或交付时，按提示申请暂借或登记。
          - speaker: narrator
            text: 门外传来一声金属落地声。
          - speaker: player
            choice: leave_404_to_check
            text: 打开门，去看看是什么掉在了外面。
      coder:
        dialogue:
          purpose: 说明发现和移动遗留物的第一步，并把玩家交给S01
          facts: [404有未完成遗留物登记, 发现物件先登记位置和状态, 移动物件按提示处理]
          forbid: [提前说出317, 提前说出Eden, 提前说明门牌来源, 在序章决定物件归属]
          tone: direct and restrained
        action: play recovery notice; choice.leave_404_to_check; cross unit-404.return
        success: recovery notice played and unit-404 threshold crossed
        effects: [recovery_notice_played=true, prologue_complete=true, chapter=max(chapter,1), clock=18:00]
        next: relic-s01-erased-door-tag / s01-00-hear-metal
  result:
    success: 玩家完成基础移动和交互教学，知道发现遗留物要先登记、移动要按提示暂借；出门后进入S01。
    cancel: 保留已完成状态；玩家可以在404继续查看公共物件，再从出口继续。
    reject: 拒绝确认时不写入对应状态；重新与N-07交谈后可继续。
    repeat: 已完成的告知不重复写入；N-07只回顾处理步骤。
    unresolved: [序章具体开始存档点, 三项状态的正式写入接口, 18:00与初始余时配置]

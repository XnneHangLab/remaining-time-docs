task:
  id: remaining-time-prologue
  title: 序章 · 404号舱
  status: ready
  package: remaining-time / mainline
  flow: linear
  branch_policy: 每个阶段只有一个推进动作；离开、返回和重复查看不改变任务状态；本卡不包含替代路线。
  tier: standard
  chapter_window: Prologue → Ch1
  background: 玩家入住404号舱。序章只教授移动、交互、目标跟随和遗留物登记规则，然后把玩家交给S01。
  trigger:
    time: game start
    place: P_404 / unit-404.start
    requires: none
  actors:
    - id: player
      name: 玩家
      role: 404遗留物临时联系人
    - id: n07
      name: N-07
      role: 说明入住和遗留物处理规则
    - id: recovery-system
      name: 回收系统
      role: 播放遗留物通知
  objects:
    - id: unit-404.bed
      state: 出生点；用于第一次移动教学
    - id: unit-404.old-record
      state: 公共旧记录；序章只确认位置和用途，不读取正文
    - id: unit-404.cabinet
      state: 遗留物暂存柜；序章只确认位置和用途
    - id: unit-404.return
      state: 通往下层回廊的出口；离开后进入S01
  handoff:
    writes: [prologue_privacy_notice_done=true, executor_credential_404=true, recovery_notice_played=true]
    opens: relic-s01-erased-door-tag
    clock: PROLOGUE_END=18:00
  stages:
    - id: wake-and-move
      place: P_404 / unit-404.bed
      reveal: 玩家需要先完成一次实际移动。
      writer:
        background: 玩家在404号舱醒来，N-07要求离开床边。
        script:
          - speaker: n07
            text: 404号舱已分配。请离开床边，确认移动正常。
          - speaker: player
            choice: stand_and_move
            text: 起身，在舱内走到床边以外的位置。
      coder:
        dialogue:
          purpose: 教授第一次移动
          facts: [玩家在404号舱醒来, 玩家需要自行移动]
          forbid: [提前说明前住户, 提前说明317或Eden, 讲解完整世界背景]
          tone: direct
        action: leave unit-404.bed and walk to a reachable position
        success: movement.completed
        effects: [prologue_woke=true]
        next: inspect-object
    - id: inspect-object
      place: P_404 / unit-404.old-record
      reveal: 玩家确认404内有公共旧记录和遗留物处理设施，但不会读取私人正文。
      writer:
        background: N-07把玩家引到404内的公共物件。
        script:
          - speaker: n07
            text: 这里有一件可查看的公共物件。先确认位置和用途，私人记录不会自动开放。
          - speaker: player
            choice: inspect_public
            text: 查看404内的公共旧记录。
      coder:
        dialogue:
          purpose: 教授靠近和查看物件
          facts: [404有公共旧记录, 查看不会打开私人记录]
          forbid: [读取旧记录正文, 暗示前住户姓名, 自动获得遗物]
          tone: practical
        action: choice.inspect_public
        success: prologue_object_seen=true
        effects: [prologue_object_seen=true]
        next: confirm-rules
    - id: confirm-rules
      place: P_404 / n07
      reveal: 玩家确认404遗留物临时联系职责。
      writer:
        background: N-07只说明发现和移动规则，不解释所有权、公开许可或完整世界背景。
        script:
          - speaker: n07
            text: 发现遗留物时，先登记位置和状态；需要移动时按提示暂借。
          - speaker: player
            choice: accept_executor_and_rules
            text: 明白。我先记录，再按提示处理。
      coder:
        dialogue:
          purpose: 教授遗留物登记规则
          facts: [玩家负责发现登记和交接404遗留物, 发现物件先登记位置和状态, 移动物件按提示暂借]
          forbid: [要求玩家判断物件归属, 提前讲解公开许可, 提前透露具体前住户]
          tone: procedural
        action: choice.accept_executor_and_rules
        success: executor_credential_404=true and prologue_privacy_notice_done=true
        effects: [executor_credential_404=true, prologue_privacy_notice_done=true]
        next: play-notice
    - id: play-notice
      place: P_404 / n07
      reveal: 回收系统说明404仍有未完成的遗留物登记。
      writer:
        background: 回收系统播放通知，门外随后传来金属落地声。
        script:
          - speaker: recovery-system
            text: 404仍有未完成的遗留物登记。发现物件时，请先登记位置和状态。
          - speaker: recovery-system
            text: 需要移动时，请按提示申请暂借并保留交接记录。
          - speaker: narrator
            text: 门外传来一声金属落地声。
          - speaker: player
            choice: acknowledge_recovery_notice
            text: 记下通知，去门外看看。
      coder:
        dialogue:
          purpose: 教授回收通知和出门前确认
          facts: [404存在未完成登记, 发现物件先登记位置和状态, 移动物件按提示暂借]
          forbid: [提前说出317, 提前说出Eden, 在序章决定物件归属]
          tone: direct
        action: choice.acknowledge_recovery_notice
        success: recovery_notice_played=true
        effects: [recovery_notice_played=true]
        next: leave-404
    - id: leave-404
      place: P_404 / unit-404.return
      reveal: 玩家出门后进入S01；序章不再增加新的调查解释。
      writer:
        background: 出口是序章最后一步。通过出口后，S01的门牌调查目标出现。
        script:
          - speaker: player
            choice: leave_404_to_check
            text: 打开门，去看看掉在外面的物件。
      coder:
        dialogue:
          purpose: 完成序章与S01交接
          facts: [玩家完成基础移动和交互教学, 玩家知道遗留物登记规则]
          forbid: [在出门前透露317或Eden, 把S01调查提前完成]
          tone: restrained
        action: choice.leave_404_to_check and cross unit-404.return
        success: scene.entered(low-deck)
        effects: [prologue_complete=true, chapter=max(chapter,1), clock=18:00]
        next: relic-s01-erased-door-tag / s01-00-hear-metal
  result:
    success: 玩家完成移动、查看、对话和遗留物登记规则教学，出门后进入S01。
    cancel: 保留已完成阶段；玩家返回当前目标即可继续。
    reject: 不推进当前阶段；不写入后续事实。
    repeat: 已完成阶段不重复写入状态。
    unresolved: [序章开始存档点, 18:00与初始余时配置]

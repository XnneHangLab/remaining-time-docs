task:
  id: remaining-time-s02
  title: S02 · 折叠餐垫
  status: proposal
  package: remaining-time / mainline
  tier: standard
  case_cluster: B / 最后一份热餐
  chapter_window: Ch1→Ch4
  background: 折叠餐垫不是必定完整或属于Mira的实物，而是一条需要接触NPC、核对有形痕迹、数据缓存和证词后在404重建的物件身份。
  trigger:
    time: Ch1→Ch4
    place: low-kitchen / rowan；可在S01交付回执后获得前往提示，也可自行到访
    requires: none
  actors:
    - id: player
      name: 玩家
      role: 调查与登记
    - id: rowan
      name: Rowan
      role: primary contact
  objects:
    - id: s02-physical-trace
      state: 厨房餐垫与四人折痕；取得方式为取走、扫描或获授权暂借，当前持有人需单独记录
    - id: s02-data-cache
      state: 当晚座位与扣时表；共享来源允许只读引用
  evidence:
    physical_trace: 厨房餐垫与四人折痕
    data_cache: 当晚座位与扣时表
    testimony: Rowan的救急说法与居民反证
    shared_evidence: TODO；使用稳定 evidence_id，取得一次即可供相关任务引用
    fallback: Mara留存的四人账
  synthesis:
    site: unit-404 / N-07
    claim: 确认缺席者被计入；登记餐垫、账本访问、故事公开
    does_not_prove: 证词真伪、原物产权或未授权的私人正文
  rights_claimants: TODO；登记实物保管、缓存访问、故事公开范围三项，不自动写入seed_signals
  shared_scene_ids: TODO；共享场景只读，不复制原物
  task_state: UNDISCOVERED → ACTIVE → MATERIALS_PARTIAL → READY_TO_SYNTHESIZE → RECONSTRUCTED → RIGHTS_REGISTERED
  stages:
    - id: contact
      place: low-kitchen / rowan
      reveal: 公共厨房有一张折叠餐垫需要核对；玩家尚不知道当晚谁在场，也未确认物件归属。
      writer:
        background: 玩家可以沿S01结束后的提示来到公共厨房，也可以自行到访。前一项调查的证据和保管选择不限制本任务。
        script:
          - speaker: player
            choice: ask_about_placemat
            text: 我想问问那张折叠餐垫。
          - speaker: rowan
            text: 先看餐垫上的折痕，再核对当晚的座位和扣时记录。听完我的说法，也问问居民。
          - speaker: player
            choice: contact_confirm
            text: 我先查看餐垫，记录痕迹。
          - speaker: player
            choice: contact_later
            text: 我稍后再来。
      coder:
        dialogue:
          purpose: 从门牌调查自然转入独立的厨房调查，明确下一步目标
          facts: [Rowan在公共厨房, 接受前可询问或离开, S01不是S02硬前置, 原件不因接受任务归玩家所有]
          forbid: [提前说出缺席者被计入, 沿用S01材料代替厨房证据, 因S01保管人不同关闭入口]
          tone: practical
        action: approach rowan; ask_about_placemat opens topic; contact_confirm accepts; contact_later leaves without accepting
        success: 玩家明确接受后激活S02；选项和地图引导指向餐垫交互点（实体待接入）
        effects: [task.active=true; material.contact=true]
        next: physical
    - id: physical
      place: 取得有形痕迹
      reveal: 玩家可以扫描、取走或获授权暂借厨房餐垫与四人折痕；取得方式和当前保管人必须记录。
      writer:
        background: 呈现物件的可观察痕迹，说明原物可能仍由NPC持有。
        script:
          - speaker: narrator
            text: 玩家可以扫描、取走或获授权暂借厨房餐垫与四人折痕；取得方式和当前保管人必须记录。
          - speaker: player
            choice: physical_confirm
            text: 确认处理“折叠餐垫”。
      coder:
        dialogue:
          purpose: 推进折叠餐垫的取得有形痕迹
          facts: [玩家可以扫描、取走或获授权暂借厨房餐垫与四人折痕；取得方式和当前保管人必须记录。]
          forbid: [不能提前补写未解锁事实、产权或授权]
          tone: neutral
        action: 记录physical_trace及custodian，不把扫描件标成玩家拥有。
        success: material.physical=true; evidence_id=s02-physical
        effects: [material.physical=true; evidence_id=s02-physical]
        next: cache
    - id: cache
      place: 取得数据缓存
      reveal: 玩家在对应档案、终端或公共记录中找到当晚座位与扣时表。
      writer:
        background: 缓存只提供时间、来源和操作记录，不自动解释动机或产权。
        script:
          - speaker: narrator
            text: 玩家在对应档案、终端或公共记录中找到当晚座位与扣时表。
          - speaker: player
            choice: cache_confirm
            text: 确认处理“折叠餐垫”。
      coder:
        dialogue:
          purpose: 推进折叠餐垫的取得数据缓存
          facts: [玩家在对应档案、终端或公共记录中找到当晚座位与扣时表。]
          forbid: [不能提前补写未解锁事实、产权或授权]
          tone: neutral
        action: 写入data_cache，并与共享证据来源建立只读引用。
        success: material.cache=true; evidence_id=s02-cache
        effects: [material.cache=true; evidence_id=s02-cache]
        next: testimony
    - id: testimony
      place: 核对证词
      reveal: 玩家向Rowan核对Rowan的救急说法与居民反证；拒绝、离开或归零时使用Mara留存的四人账。
      writer:
        background: 证词来源必须标记为当前陈述、固定记录或公共替代，不伪造当下同意。
        script:
          - speaker: narrator
            text: 玩家向Rowan核对Rowan的救急说法与居民反证；拒绝、离开或归零时使用Mara留存的四人账。
          - speaker: player
            choice: testimony_confirm
            text: 确认处理“折叠餐垫”。
      coder:
        dialogue:
          purpose: 推进折叠餐垫的核对证词
          facts: [玩家向Rowan核对Rowan的救急说法与居民反证；拒绝、离开或归零时使用Mara留存的四人账。]
          forbid: [不能提前补写未解锁事实、产权或授权]
          tone: neutral
        action: 记录testimony_source及缺席原因；三类材料齐备即可进入校准。
        success: material.testimony=true; task_state=READY_TO_SYNTHESIZE
        effects: [material.testimony=true; task_state=READY_TO_SYNTHESIZE]
        next: synthesize
    - id: synthesize
      place: 404校准与三权登记
      reveal: N-07将厨房餐垫与四人折痕、当晚座位与扣时表和证词叠合，恢复：确认缺席者被计入；登记餐垫、账本访问、故事公开。
      writer:
        background: 校准只证明材料之间的对应关系，不替玩家判定谁说谎。
        script:
          - speaker: narrator
            text: N-07将厨房餐垫与四人折痕、当晚座位与扣时表和证词叠合，恢复：确认缺席者被计入；登记餐垫、账本访问、故事公开。
          - speaker: player
            choice: synthesize_confirm
            text: 确认处理“折叠餐垫”。
      coder:
        dialogue:
          purpose: 让玩家确认证据对应关系并查看三权登记
          facts: [N-07将厨房餐垫与四人折痕、当晚座位与扣时表和证词叠合，恢复：确认缺席者被计入；登记餐垫、账本访问、故事公开。]
          forbid: [不能提前补写未解锁事实、产权或授权]
          tone: neutral
        action: 玩家确认合成并分别登记实物保管、缓存访问、故事公开范围。
        success: task_state=RECONSTRUCTED; synthesis=true
        effects: [task_state=RECONSTRUCTED; synthesis=true]
        next: register
    - id: register
      place: 确认登记
      reveal: 玩家查看三权结果；未逐项决定时保留待登记状态，不由批量按钮补齐材料。
      writer:
        background: 区分实物保管、缓存访问和故事公开范围；原物损坏或仍在NPC手中均可完成。
        script:
          - speaker: narrator
            text: 玩家查看三权结果；未逐项决定时保留待登记状态，不由批量按钮补齐材料。
          - speaker: player
            choice: register_confirm
            text: 确认处理“折叠餐垫”。
      coder:
        dialogue:
          purpose: 推进折叠餐垫的确认登记
          facts: [玩家查看三权结果；未逐项决定时保留待登记状态，不由批量按钮补齐材料。]
          forbid: [不能提前补写未解锁事实、产权或授权]
          tone: neutral
        action: 实物保管、缓存访问、故事公开三栏均明确确认才完成登记；只确认一项时保持待登记，其余可在午夜前继承柜复核。
        success: task_state=RIGHTS_REGISTERED; rights_recorded=true
        effects: [task_state=RIGHTS_REGISTERED; rights_recorded=true]
        next: done
  result:
    success: 折叠餐垫完成校准；证物槽点亮，即使原物未归玩家也保留来源与保管人。
    cancel: 保留已经取得的材料和来源，不重置任务。
    reject: 不推进当前阶段；玩家可从当前NPC、公共档案或兜底来源继续。
    repeat: 已写入的材料和登记幂等复用，不重复取得原物或重复写入信号。
    unresolved: rights_claimants、shared_scene_ids及具体运行时变量名待工程评审确认；餐垫、座位扣时表和Mara四人账的交互实体尚未接入，独立材料目标应允许任意顺序取得，不能把本卡展示顺序直接变成强制前置。

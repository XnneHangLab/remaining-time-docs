task:
  id: remaining-time-s02
  title: S02 · 折叠餐垫
  status: proposal
  package: remaining-time / mainline
  tier: standard
  case_cluster: B / 最后一份热餐
  chapter_window: Ch1→Ch4
  background: 公共厨房的折叠餐垫留下四人折痕，玩家需要记录物理痕迹、核对同一桌位的公共账表，再由N-07校准对应关系。
  trigger:
    time: Ch1→Ch4
    place: B / 最后一份热餐
    requires: none
  actors:
    - id: rowan
      role: primary contact
  objects:
    - id: s02-physical-trace
      state: 厨房餐垫与四人折痕；只扫描，不移动原件
    - id: s02-data-cache
      state: 当晚座位与扣时表；记录同一桌位标识
  evidence:
    physical_trace: 厨房餐垫与四人折痕
    data_cache: 当晚座位与扣时表
    synthesis: N-07将两份材料按桌位标识校准
  synthesis:
    site: unit-404 / N-07
    claim: 确认公共记录中计入了缺席者
    does_not_prove: 证词真伪、原物产权、私人正文或额外授权
  task_state: UNDISCOVERED → ACTIVE → MATERIALS_PARTIAL → RECONSTRUCTED
  flow: linear
  branch_policy:
    progression: only_current_step
    side_choices: non_progressing
    leave_and_return: no_progress
  stages:
    - id: contact
      place: 公共厨房 / Rowan
      reveal: Rowan说明厨房餐垫需要先记录，再核对对应的公共账表。
      writer:
        background: 只说明调查对象、原件位置和两类固定材料，不提前解释缺席原因。
        script:
          - speaker: narrator
            text: Rowan请你先记录厨房餐垫，再核对当晚座位与扣时表。
          - speaker: player
            choice: contact_confirm
            text: 接受折叠餐垫调查。
      coder:
        dialogue:
          purpose: 激活折叠餐垫调查
          facts: [餐垫原件留在厨房，后续只记录餐垫和公共账表]
          forbid: [不能提前判断缺席原因、产权或授权]
          tone: neutral
        action: 玩家接受调查，不移动餐垫。
        success: task.active=true
        effects: [s02_accepted=true]
        next: physical
    - id: physical
      place: 公共厨房 / 餐垫
      reveal: 玩家扫描餐垫上的四人折痕和桌位标识，原件继续留在厨房。
      writer:
        background: 呈现可观察痕迹，不把折痕解释成四人都曾到场。
        script:
          - speaker: narrator
            text: 餐垫保留四人折痕和桌位标识；原件仍留在厨房。
          - speaker: player
            choice: physical_confirm
            text: 扫描餐垫痕迹。
      coder:
        dialogue:
          purpose: 记录固定物理证据
          facts: [四人折痕、桌位标识]
          forbid: [不能移动、取走或暂借餐垫]
          tone: neutral
        action: 扫描餐垫并记录桌位标识。
        success: material.physical=true; evidence_id=s02-physical
        effects: [s02_trace=true; s02_trace_table=kitchen-four-seat-v1]
        next: cache
    - id: cache
      place: 公共厨房 / 座位与扣时表
      reveal: 玩家记录与餐垫相同桌位标识的当晚座位与扣时表。
      writer:
        background: 公共账表只提供记录和桌位对应关系，不自动解释动机。
        script:
          - speaker: narrator
            text: 座位与扣时表保留当晚记录；先核对它的桌位标识。
          - speaker: player
            choice: cache_confirm
            text: 记录座位与扣时表。
      coder:
        dialogue:
          purpose: 取得固定公共记录
          facts: [当晚座位、扣时、桌位标识]
          forbid: [不能把账表直接写成完整事实或产权证明]
          tone: neutral
        action: 记录账表并保存桌位标识。
        success: material.cache=true; evidence_id=s02-cache
        effects: [s02_cache_found=true; s02_cache_table=kitchen-four-seat-v1]
        next: synthesize
    - id: synthesize
      place: 404 / N-07
      reveal: N-07将餐垫和账表按同一桌位标识校准，确认公共记录中计入了缺席者。
      writer:
        background: 校准只确认两份材料的对应关系，不替任何人判断动机。
        script:
          - speaker: narrator
            text: 两份记录的桌位标识一致。N-07可以校准它们的对应关系。
          - speaker: player
            choice: synthesize_confirm
            text: 让N-07校准餐垫与账表。
      coder:
        dialogue:
          purpose: 完成固定证据的对应校准
          facts: [餐垫折痕、座位扣时表、相同桌位标识]
          forbid: [不能追加证词路线、替代账、原物保管选择或公开授权]
          tone: neutral
        action: 玩家在404确认校准。
        success: task_state=RECONSTRUCTED; synthesis=true
        effects: [s02_reconstructed=true; s02_complete=true]
        next: done
  result:
    success: 折叠餐垫完成校准；原件继续留在厨房，物理痕迹和公共账表已保留。
    cancel: 保留已取得的扫描记录和账表来源，不重置任务。
    reject: 不推进当前阶段；回到当前目标后继续。
    repeat: 已写入的扫描、账表和校准结果幂等复用，不重复移动或取得原件。
  unresolved:
    - shared_evidence: 是否在后续任务中以只读方式引用s02-physical和s02-cache。
